<div class="book-container">
  <!-- Previous button -->
  <button #prevBtn id="prev-button" (click)="goPrevPage()">
    <i class="fas fa-chevron-left"></i>
  </button>

  <!-- Book -->
  <div #book class="book">
    <!-- Page 1 -->
    <div class="paper" id="p1" [ngClass]="{ flipped: flippedPages[1] }">
      <div class="front">
        <div class="front-content" id="f1">
          <img src="assets/gitHub.jpeg" alt="Oshadi" class="profile-img" />
          <h1>Welcome to my Portfolio</h1>
          <br /><br />
          <h2>I'm Oshadi</h2>

          <!-- Short Summary -->
          <p class="summary">
            Currently pursuing IT undergraduate studies and building interactive
            web applications using Angular, Java Spring Boot, and MySQL.
          </p>

          <!-- Social Media Links -->
          <div class="social-icons">
            <a href="https://github.com/oshadi" target="_blank" title="GitHub">
              <i class="fab fa-github"></i>
            </a>
            <a
              href="https://linkedin.com/in/oshadi"
              target="_blank"
              title="LinkedIn"
            >
              <i class="fab fa-linkedin"></i>
            </a>
            <a href="mailto:oshadi@example.com" title="Email">
              <i class="fas fa-envelope"></i>
            </a>
          </div>
        </div>
      </div>
      <div class="back">
        <div class="back-content" id="b1">
          <h1>Back 1</h1>
        </div>
      </div>
    </div>

    <!-- Page 2 -->
    <div class="paper" id="p2" [ngClass]="{ flipped: flippedPages[2] }">
      <div class="front">
        <div class="front-content" id="f2">
          <h1>Front 2</h1>
        </div>
      </div>
      <div class="back">
        <div class="back-content" id="b2">
          <h1>Back 2</h1>
        </div>
      </div>
    </div>

    <!-- Page 3 -->
    <div class="paper" id="p3" [ngClass]="{ flipped: flippedPages[3] }">
      <div class="front">
        <div class="front-content" id="f3">
          <h1>Front 3</h1>
        </div>
      </div>
      <div class="back">
        <div class="back-content" id="b3">
          <h1>Back 3</h1>
        </div>
      </div>
    </div>
  </div>

  <!-- Next button -->
  <button #nextBtn id="next-button" (click)="goNextPage()">
    <i class="fas fa-chevron-right"></i>
  </button>
</div>
